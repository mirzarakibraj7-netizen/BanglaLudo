<style>

@keyframes bob{50%{transform:translate(-50%,-75%) scale(1.3)}}

background:radial-gradient(circle at 35% 30%,#fff9 0,#fff0 38%),var(--c);border:2.5px solid #fff;box-shadow:0 0 0 1.5px #000a,0 3px 4px #0007,inset 0 -3px 0 #0003}
.tk::after{content:"";position:absolute;inset:28%;border-radius:50%;background:#fff5}

@keyframes r{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) scale(1.12)}50%{transform:scale(1.16);box-shadow:0 0 18px 4px #ffd54f}75%{transform:rotate(9deg) scale(1.12)}}
#hint{font-size:14px;opacity:.75;min-height:20px}
</style><script src="ads.js"></script></head><body>
<h1><span>🎲</span> BANGLA LUDO</h1>
<div id="setup">
<p class="sub">বন্ধুদের সাথে বা কম্পিউটারের সাথে মজার লুডু খেলো</p>

</div>

</div>
<script>
const COL=["#e8222b", "#1fae4b", "#ffd000", "#1768e8"],NAME=["লাল","সবুজ","হলুদ","নীল"],AV=["🦊","🐸","🐥","🐬"],PC=COL,PD=COL,ST=[0,13,26,39],SAFE=[0,8,13,21,26,34,39,47],T0="translate(-50%,-50%)";
const path=[];for(let c=1;c<=5;c++)path.push([6,c]);for(let r=5;r>=0;r--)path.push([r,6]);path.push([0,7],[0,8]);for(let r=1;r<=5;r++)path.push([r,8]);for(let c=9;c<=14;c++)path.push([6,c]);path.push([7,14],[8,14]);for(let c=13;c>=9;c--)path.push([8,c]);for(let r=9;r<=14;r++)path.push([r,8]);path.push([14,7],[14,6]);for(let r=13;r>=9;r--)path.push([r,6]);for(let c=5;c>=0;c--)path.push([8,c]);path.push([7,0],[6,0]);
const H=[k=>[7,1+k],k=>[1+k,7],k=>[7,13-k],k=>[13-k,7]],O=[[0,0],[0,9],[9,9],[9,0]],FIN=[[7.5,6.8],[6.8,7.5],[7.5,8.2],[8.2,7.5]];
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n),clone=o=>JSON.parse(JSON.stringify(o));
/* ---------- সাউন্ড (ফাইল লাগে না, ব্রাউজারেই তৈরি হয়) ---------- */
let AC=null,muted=false;try{muted=localStorage.getItem("ludoMute")=="1"}catch(e){}
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,t0,f2){if(muted)return;const a=ac();if(!a)return;try{const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function noise(d,v,t0){if(muted)return;const a=ac();if(!a)return;try{const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),h=a.createBiquadFilter();h.type="highpass";h.frequency.value=2200;s.buffer=b;g.gain.value=v||.15;s.connect(h);h.connect(g);g.connect(a.destination);s.start(a.currentTime+(t0||0))}catch(e){}}
const SFX={
roll(){noise(.05,.22);tone(250+rnd(450),.05,"square",.05)},
land(){tone(240,.14,"triangle",.3,0,110);noise(.06,.2)},
step(){tone(430+rnd(70),.07,"triangle",.22,0,640)},
launch(){tone(280,.28,"sawtooth",.1,0,1000)},
six(){tone(660,.1,"triangle",.25);tone(880,.1,"triangle",.25,.09);tone(1320,.2,"triangle",.22,.18)},
safe(){tone(900,.09,"sine",.18);tone(1250,.14,"sine",.16,.08)},
cut(){tone(650,.28,"square",.14,0,140);tone(180,.35,"sawtooth",.12,.12,70)},
home(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.25,i*.1))},
nomove(){tone(280,.25,"sine",.22,0,170)},
buzz(){tone(130,.45,"sawtooth",.14);tone(125,.45,"square",.08,.02)},
win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.28,"triangle",.28,i*.15));[1568,1319,1568,2093].forEach((f,i)=>tone(f,.4,"sine",.2,1.1+i*.18))}};
document.addEventListener("pointerdown",()=>{if(AC&&AC.state=="suspended")AC.resume()},true);
function sndLbl(){$("snd").textContent=muted?"🔇 সাউন্ড বন্ধ":"🔊 সাউন্ড চালু"}
$("snd").onclick=()=>{muted=!muted;try{localStorage.setItem("ludoMute",muted?"1":"0")}catch(e){}sndLbl();if(!muted){ac();SFX.land()}};sndLbl();
let np=4,mode="bot",G=null,S=null,V=null,PL=[],q=Promise.resolve(),lastRs=0,lastMs=0;
const bot=c=>mode=="bot"&&c!=0,mine=c=>!bot(c);
function opts(el,list,cur,fn){el.innerHTML="";list.forEach(([v,t])=>{const b=document.createElement("button");b.className="opt"+(v==cur?" on":"");b.textContent=t;b.onclick=()=>{fn(v);opts(el,list,v,fn)};el.appendChild(b)})}
opts($("np"),[[2,"২ জন"],[3,"৩ জন"],[4,"৪ জন"]],4,v=>np=v);
opts($("md"),[["bot","🤖 কম্পিউটারের সাথে"],["all","👨‍👩‍👧 সবাই মানুষ (একই ফোনে)"]],"bot",v=>mode=v);
const PIPS=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
function showDice(n,c){const d=$("d"+c);if(!d)return;d.innerHTML="";for(let i=0;i<9;i++){const e=document.createElement("i");if(n&&PIPS[n-1].includes(i))e.className="on";d.appendChild(e)}}
$("start").onclick=()=>{ac();PL=np==2?[0,2]:np==3?[0,1,2]:[0,1,2,3];V=[0,1,2,3].map(()=>[-1,-1,-1,-1]);$("setup").style.display="none";$("game").style.display="block";build();
G={pl:PL,T:[0,1,2,3].map(()=>[-1,-1,-1,-1]),turn:0,roll:0,ph:"roll",sixes:0,msg:"",ev:"",win:-1,rs:0,ms:0,mv:null,last:[6,6,6,6]};advance(false)};
/* ---------- ইঞ্জিন ---------- */
function legal(c,i,r,T){const p=T[c][i];return p<0?r==6:p<56&&p+r<=56}
function pub(){present(clone(G))}
function advance(next){if(next){G.turn=(G.turn+1)%G.pl.length;G.sixes=0}const c=G.pl[G.turn];G.ph="roll";G.mv=null;G.ev="";G.msg=NAME[c]+"-এর পালা"+(bot(c)?" (কম্পিউটার)":"");pub();if(bot(c))setTimeout(doRoll,1100)}
async function doRoll(){if(G.ph!="roll"||G.win>=0)return;G.ph="busy";const c=G.pl[G.turn],r=1+rnd(6);G.roll=r;G.rs++;G.last[c]=r;G.mv=null;G.ev="";G.sixes=r==6?G.sixes+1:0;
const mv=[0,1,2,3].filter(i=>legal(c,i,r,G.T));
if(G.sixes>=3){G.ev="six3";G.msg="টানা তিন ছক্কা! পালা বাতিল";pub();await sl(1900);return advance(true)}
if(!mv.length){G.ev="nomove";G.msg=NAME[c]+": "+r+" — চালার মতো গুটি নেই";pub();await sl(1900);return advance(r!=6)}
G.ph="pick";G.msg=NAME[c]+": "+r+(bot(c)?"":" — গুটি বেছে নাও");pub();const rs=G.rs;
if(bot(c)||mv.length==1||mv.every(i=>G.T[c][i]<0)){await sl(bot(c)?1500:1300);if(G.rs==rs&&G.ph=="pick")pick(bot(c)?botPick(c,mv,r):mv[0])}}
function botPick(c,mv,r){let best=mv[0],bs=-1;mv.forEach(i=>{const p=G.T[c][i],n=p<0?0:p+r;let s=n+(p<0?30:0);if(n==56)s+=60;if(n<=50){const k=(ST[c]+n)%52;if(!SAFE.includes(k)&&G.pl.some(o=>o!=c&&G.T[o].some(x=>x>=0&&x<=50&&(ST[o]+x)%52==k)))s+=80}if(s>bs){bs=s;best=i}});return best}
async function pick(i){if(G.ph!="pick"||G.win>=0)return;const c=G.pl[G.turn],r=G.roll;if(!legal(c,i,r,G.T))return;G.ph="busy";
const f=G.T[c][i],t=f<0?0:f+r,cap=[];G.T[c][i]=t;
if(t<=50){const k=(ST[c]+t)%52;if(!SAFE.includes(k))G.pl.forEach(o=>{if(o!=c)G.T[o].forEach((x,j)=>{if(x>=0&&x<=50&&(ST[o]+x)%52==k){G.T[o][j]=-1;cap.push([o,j])}})})}
G.ms++;G.mv={c,i,f,t,cap};
if(G.T[c].every(x=>x==56)){G.win=c;G.msg="🎉 "+NAME[c]+" জিতে গেছে!";pub();return}
G.msg=cap.length?"✂️ কেটে দিয়েছ! আবার চাল পাবে":t==56?"🏆 একটা গুটি ঘরে পৌঁছেছে! আবার চাল":"";pub();
await sl((f<0?1:t-f)*110+600+(cap.length?600:0));
advance(!(r==6||cap.length||t==56))}
/* ---------- অ্যানিমেশন ---------- */
function present(g){q=q.then(()=>show(g)).catch(e=>console.error(e))}
function hop(e){SFX.step();e.animate([{transform:T0+" scale(1)"},{transform:"translate(-50%,-95%) scale(1.4)"},{transform:T0+" scale(1)"}],{duration:110})}
function fly(em,el,big){const r=el.getBoundingClientRect(),d=document.createElement("div");d.textContent=em;d.style.cssText="position:fixed;left:"+(r.left+r.width/2)+"px;top:"+r.top+"px;font-size:"+(big?46:30)+"px;z-index:50;pointer-events:none";document.body.appendChild(d);d.animate([{transform:"translate(-50%,-50%) scale(.2) rotate(-20deg)",opacity:0},{transform:"translate(-50%,-80px) scale(1.4) rotate(10deg)",opacity:1,offset:.3},{transform:"translate(-50%,-150px) scale(1) rotate(0)",opacity:0}],{duration:1400,easing:"ease-out"}).onfinish=()=>d.remove()}
async function show(g){
document.querySelectorAll(".tk.go").forEach(e=>e.classList.remove("go"));
const cur=g.pl[g.turn],dc=$("d"+cur);
if(g.rs!=lastRs){lastRs=g.rs;dc.animate([{transform:"translateY(0) rotate(0) scale(1)"},{transform:"translateY(-30px) rotate(360deg) scale(1.3)"},{transform:"translateY(0) rotate(720deg) scale(1)"}],{duration:420,easing:"ease-out"});for(let n=0;n<8;n++){showDice(1+rnd(6),cur);SFX.roll();await sl(50)}
showDice(g.roll,cur);SFX.land();dc.animate([{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:250});
if(g.ev=="six3"){fly("🚫",dc,1);SFX.buzz()}else if(g.ev=="nomove"){SFX.nomove();if(rnd(3)==0)fly("😅",dc)}else if(g.roll==6){fly("🔥",dc,1);SFX.six()}}
g.pl.forEach(x=>showDice(g.last[x],x));
if(g.mv&&g.ms!=lastMs){lastMs=g.ms;const m=g.mv,e=$("t"+m.c+m.i);e.style.zIndex=8;
if(m.f<0){V[m.c][m.i]=0;draw();hop(e);SFX.launch();fly("🚀",e);await sl(280)}else for(let p=m.f+1;p<=m.t;p++){V[m.c][m.i]=p;draw();hop(e);await sl(110)}
e.animate([{transform:T0+" scale(1.35,.7)"},{transform:T0+" scale(.9,1.12)"},{transform:T0+" scale(1)"}],{duration:280});e.style.zIndex="";
if(m.cap.length){SFX.cut();if(rnd(2)==0)fly("😈",e,1);m.cap.forEach(([o,j])=>{const x=$("t"+o+j);x.animate([{transform:T0+" scale(1)"},{transform:T0+" scale(2) rotate(200deg)",opacity:.2},{transform:T0+" scale(1)"}],{duration:560});fly("😭",x)});await sl(600)}
else if(m.t==56){SFX.home();fly("🏆",e,1);e.animate([{transform:T0+" scale(1)"},{transform:T0+" scale(2) rotate(360deg)"},{transform:T0+" scale(1)"}],{duration:600});await sl(500)}
else if(m.f>=0&&m.t<=50&&SAFE.includes((ST[m.c]+m.t)%52)){fly("🛡️",e);SFX.safe()}}
V=clone(g.T);S=g;draw();ui(g)}
function ui(g){const c=g.pl[g.turn],ok=mine(c)&&g.win<0;
$("chips").innerHTML=g.pl.map((x,j)=>'<span class="chip'+(j==g.turn&&g.win<0?" on":"")+'">'+AV[x]+" "+NAME[x]+(bot(x)?" 🤖":"")+"</span>").join("");
g.pl.forEach(x=>{const d=$("d"+x);d.style.borderColor=PD[x];d.classList.toggle("off",x!=c||g.win>=0)});$("msg").textContent=g.msg;
document.querySelectorAll(".yard").forEach((y,k)=>y.classList.toggle("act",k==c&&g.win<0));
g.pl.forEach(x=>$("av"+x).classList.toggle("on",x==c&&g.win<0));
g.pl.forEach(x=>$("d"+x).classList.toggle("ready",x==c&&ok&&g.ph=="roll"));
$("hint").textContent=ok?(g.ph=="roll"?"👆 নিজের ছক্কায় চাপ দাও":g.ph=="pick"?"👆 জ্বলজ্বলে গুটিতে চাপ দাও":""):"";
if(ok&&g.ph=="pick")[0,1,2,3].forEach(i=>legal(c,i,g.roll,g.T)&&$("t"+c+i).classList.add("go"));
if(g.win>=0)win(g.win)}
function win(c){if(window._cf)return;window._cf=1;setTimeout(function(){window.LudoAds&&LudoAds.gameEnd()},2500);SFX.win();$("ctr").textContent="👑";fly("👑",$("d"+c),1);const b=$("board");
for(let i=0;i<60;i++){const d=document.createElement("div");d.textContent=["🎉","✨","🎊","⭐","🏆"][i%5];d.style.cssText="position:absolute;left:"+rnd(96)+"%;top:-30px;font-size:"+(16+rnd(18))+"px;z-index:20;pointer-events:none";b.appendChild(d);d.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:"translateY(560px) rotate("+(rnd(720)-360)+"deg)",opacity:.8}],{duration:1800+rnd(1800),delay:rnd(1200),fill:"forwards"})}}
/* ---------- বোর্ড ---------- */
function yardPos(c,i){return[O[c][0]+(i>1?4.6:1.4),O[c][1]+(i%2?4.6:1.4)]}
function pos(c,i){const p=V[c][i];if(p<0)return yardPos(c,i);if(p<=50){const x=path[(ST[c]+p)%52];return[x[0]+.5,x[1]+.5]}if(p<=55){const x=H[c](p-51);return[x[0]+.5,x[1]+.5]}return FIN[c]}
function draw(){const g={};PL.forEach(c=>{for(let i=0;i<4;i++){const x=pos(c,i);const k=x.join()+(V[c][i]<0?"y"+c+i:"");(g[k]=g[k]||[]).push([c,i,x])}});
Object.values(g).forEach(a=>a.forEach(([c,i,x],n)=>{const e=$("t"+c+i),o=(n-(a.length-1)/2)*2.2;e.style.left=(x[1]/15*100+o)+"%";e.style.top=(x[0]/15*100)+"%"}))}
function build(){const b=$("board");b.innerHTML="";
for(let r=0;r<15;r++)for(let c=0;c<15;c++){const d=document.createElement("div");d.className="c";const k=r+","+c;
if((r<6||r>8)&&(c<6||c>8)){d.className="z";d.style.background=PC[r<6?(c<6?0:1):(c<6?3:2)]}
else if(r>=6&&r<=8&&c>=6&&c<=8)d.className="z";
else{let bg="";for(let i=0;i<4;i++)for(let j=0;j<5;j++)if(H[i](j).join()==k){bg=PD[i];d.className="c s";d.textContent="›"}
const i=path.findIndex(x=>x.join()==k);if(i>=0){const s=ST.indexOf(i);if(s>=0){bg=PD[s];d.className="c s";d.textContent="🏠"}else if(SAFE.includes(i))d.textContent="★"}
if(bg)d.style.background=bg}
b.appendChild(d)}
b.insertAdjacentHTML("beforeend",'<svg viewBox="0 0 3 3" style="position:absolute;left:40%;top:40%;width:20%;height:20%;z-index:1"><polygon points="0,0 0,3 1.5,1.5" fill="'+PD[0]+'"/><polygon points="0,0 3,0 1.5,1.5" fill="'+PD[1]+'"/><polygon points="3,0 3,3 1.5,1.5" fill="'+PD[2]+'"/><polygon points="0,3 3,3 1.5,1.5" fill="'+PD[3]+'"/></svg><div class="ctr" id="ctr">⭐</div>');
for(let c=0;c<4;c++){const y=document.createElement("div");y.className="yard";y.style.left=(O[c][1]+.6)/15*100+"%";y.style.top=(O[c][0]+.6)/15*100+"%";y.style.setProperty("--c",COL[c]);b.appendChild(y);
const a=document.createElement("div");a.className="av"+(PL.includes(c)?" pl":"");a.id="av"+c;a.textContent=AV[c];a.style.left=(O[c][1]+3)/15*100+"%";a.style.top=(O[c][0]+3)/15*100+"%";b.appendChild(a);
for(let i=0;i<4;i++){const s=document.createElement("div"),x=yardPos(c,i);s.className="slot";s.style.background=PD[c];s.style.left=x[1]/15*100+"%";s.style.top=x[0]/15*100+"%";b.appendChild(s)}
if(PL.includes(c)){const d=document.createElement("div");d.className="dice off";d.id="d"+c;d.style.borderColor=PD[c];d.style.background="#fff";d.style.left=(O[c][1]+3)/15*100+"%";d.style.top=(O[c][0]+3)/15*100+"%";d.onclick=()=>{if(S&&S.win<0&&S.ph=="roll"&&S.pl[S.turn]==c&&mine(c))doRoll()};b.appendChild(d);showDice(6,c)}}
PL.forEach(c=>{for(let i=0;i<4;i++){const t=document.createElement("div");t.className="tk";t.id="t"+c+i;t.style.setProperty("--c",COL[c]);t.onclick=()=>{if(S&&S.win<0&&S.ph=="pick"&&c==S.pl[S.turn]&&mine(c)&&legal(c,i,S.roll,S.T))pick(i)};b.appendChild(t)}});draw()}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
