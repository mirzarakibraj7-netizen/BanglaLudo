name: Build APK
on: 
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Add AdMob App ID to manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/ s|<application|<application|' "$M"
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf-8").read()
          tag='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7808329877913294~9456707590"/>'
          if "APPLICATION_ID" not in s:
              i=s.index("<application"); j=s.index(">",i)+1
              s=s[:j]+"\n        "+tag+s[j:]
          open(p,"w",encoding="utf-8").write(s)
          PY
          grep APPLICATION_ID "$M"
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BANGLA-LUDO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
