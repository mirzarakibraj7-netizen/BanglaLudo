name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded zip files (if any)
        run: |
          for z in $(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*"); do
            echo "Unzipping $z"; mkdir -p "unzipped/$(basename "$z" .zip)"; unzip -o -q "$z" -d "unzipped/$(basename "$z" .zip)" || true
          done
      - name: Find project folder
        run: |
          C=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$C" ]; then echo "capacitor.config.json পাওয়া যায়নি — প্রজেক্টের ফাইল আপলোড হয়নি"; find . -maxdepth 3 -not -path "./.git/*" | head -50; exit 1; fi
          P=$(dirname "$C")
          echo "PROJ=$P" >> "$GITHUB_ENV"
          echo "Project folder: $P"; ls -la "$P"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and create Android project
        run: |
          cd "$PROJ"
          ls package.json www/index.html
          npm install
          npx cap add android
          npx cap sync android
      - name: Add AdMob App ID to manifest
        run: |
          cd "$PROJ"
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf-8").read()
          tag='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7808329877913294~9456707590"/>'
          if "APPLICATION_ID" not in s:
              i=s.index("<application"); j=s.index(">",i)+1
              s=s[:j]+"\n        "+tag+s[j:]
          open(p,"w",encoding="utf-8").write(s)
          PY
          grep APPLICATION_ID android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BANGLA-LUDO-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
