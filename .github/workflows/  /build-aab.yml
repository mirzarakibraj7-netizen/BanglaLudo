name: Build AAB (Play Store)
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded zip files (if any)
        run: |
          n=0
          find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" -print0 | while IFS= read -r -d '' z; do
            n=$((n+1)); echo "Unzipping: $z"; mkdir -p "unzipped/z$n"; unzip -o -q "$z" -d "unzipped/z$n" || true
          done
      - name: Find project folder
        run: |
          BEST=""
          while IFS= read -r C; do
            D=$(dirname "$C"); echo "পাওয়া গেছে: $D"
            if [ -f "$D/BANGLA-LUDO-PLAY.marker" ]; then BEST="$D"; fi
          done < <(find . -name capacitor.config.json -not -path "*/node_modules/*")
          if [ -z "$BEST" ]; then echo "❌ Play ভার্সনের প্রজেক্ট (BANGLA-LUDO-Play zip) পাওয়া যায়নি। পুরনো zip মুছে সঠিক zip আপলোড করুন।"; find . -maxdepth 3 -not -path "./.git/*" | head -50; exit 1; fi
          echo "PROJ=$BEST" >> "$GITHUB_ENV"; echo "✅ ব্যবহার হচ্ছে: $BEST"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and create Android project
        run: |
          cd "$PROJ"
          npm install
          npx cap add android
          npx cap sync android
          grep -n "targetSdkVersion\|compileSdkVersion" android/variables.gradle
      - name: Apply app icon
        run: |
          cd "$PROJ"
          test -d android-res
          cp -r android-res/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo "✅ আইকন কপি হয়েছে"
      - name: Add AdMob App ID and version
        run: |
          cd "$PROJ"
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf-8").read()
          tag='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7808329877913294~9456707590"/>'
          if "APPLICATION_ID" not in s:
              i=s.index("<application"); j=s.index(">",i)+1
              s=s[:j]+"\n        "+tag+s[j:]
          open(p,"w",encoding="utf-8").write(s)
          PY
          grep APPLICATION_ID android/app/src/main/AndroidManifest.xml
          # প্রতিটি নতুন বিল্ডে versionCode বাড়বে (Play Store-এ প্রতিবার বড় সংখ্যা লাগে)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/upload.jks"
            echo "STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"; echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"; echo "NEWKEY=no" >> "$GITHUB_ENV"
            echo "✅ আগের সংরক্ষিত চাবি ব্যবহার হচ্ছে"
          else
            P=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ks/upload.jks" -alias bangla -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=BANGLA LUDO, O=Mirza Raj, C=BD"
            echo "STORE_PASS=$P" >> "$GITHUB_ENV"; echo "KEY_ALIAS=bangla" >> "$GITHUB_ENV"; echo "NEWKEY=yes" >> "$GITHUB_ENV"
            { echo "Keystore: upload.jks"; echo "Alias: bangla"; echo "Password: $P"; echo; echo "base64 (GitHub Secret KEYSTORE_BASE64):"; base64 -w0 "$RUNNER_TEMP/ks/upload.jks"; echo; } > "$RUNNER_TEMP/ks/KEYSTORE-INFO.txt"
            echo "⚠️ নতুন চাবি বানানো হয়েছে — Artifacts থেকে নামিয়ে নিরাপদে রাখুন"
          fi
      - name: Build release AAB
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Sign AAB
        run: |
          mkdir -p out
          F=$(find "$PROJ/android" -name "*.aab" | head -1)
          if [ -z "$F" ]; then echo "❌ AAB পাওয়া যায়নি"; exit 1; fi
          cp "$F" out/BANGLA-LUDO.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/ks/upload.jks" -storepass "$STORE_PASS" out/BANGLA-LUDO.aab "$KEY_ALIAS"
          jarsigner -verify out/BANGLA-LUDO.aab | head -3
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: BANGLA-LUDO-aab-run${{ github.run_number }}
          path: out/BANGLA-LUDO.aab
          if-no-files-found: error
      - name: Collect new key
        if: env.NEWKEY == 'yes'
        run: |
          mkdir -p newkey; cp "$RUNNER_TEMP/ks/upload.jks" newkey/; cp "$RUNNER_TEMP/ks/KEYSTORE-INFO.txt" newkey/
      - uses: actions/upload-artifact@v4
        if: env.NEWKEY == 'yes'
        with:
          name: SAVE-THIS-KEYSTORE
          path: newkey
          if-no-files-found: error
