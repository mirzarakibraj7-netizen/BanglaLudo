name: Build APK (phone install)
on:
  workflow_dispatch: null
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip uploaded zip files (if any)
      run: "n=0\nfind . -maxdepth 5 -iname \"*.zip\" -not -path \"./.git/*\" -not -path \"./unzipped/*\" -print0 | while IFS= read -r -d '' z; do\n  n=$((n+1)); echo \"Unzipping: $z\"; mkdir -p \"unzipped/z$n\"; unzip -o -q \"$z\" -d \"unzipped/z$n\" || true\ndone\n"
    - name: Find project folder
      run: "BEST=\"\"\nwhile IFS= read -r C; do\n  D=$(dirname \"$C\"); echo \"পাওয়া গেছে: $D\"\n  if [ -f \"$D/BANGLA-LUDO-PLAY.marker\" ]; then BEST=\"$D\"; fi\ndone < <(find . -name capacitor.config.json -not -path \"*/node_modules/*\")\nif [ -z \"$BEST\" ]; then echo \"❌ Play ভার্সনের প্রজেক্ট (BANGLA-LUDO-Play zip) পাওয়া যায়নি। পুরনো zip মুছে সঠিক zip আপলোড করুন।\"; find . -maxdepth 3 -not -path \"./.git/*\" | head -50; exit 1; fi\necho \"PROJ=$BEST\" >> \"$GITHUB_ENV\"; echo \"✅ ব্যবহার হচ্ছে: $BEST\"\n"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Install and create Android project
      run: 'cd "$PROJ"

        npm install

        npx cap add android

        npx cap sync android

        grep -n "targetSdkVersion\|compileSdkVersion" android/variables.gradle

        '
    - name: Apply app icon
      run: 'cd "$PROJ"

        test -d android-res

        cp -r android-res/* android/app/src/main/res/

        rm -rf android/app/src/main/res/mipmap-anydpi-v26

        echo "✅ আইকন কপি হয়েছে"

        '
    - name: Add AdMob App ID and version
      run: "cd \"$PROJ\"\npython3 - <<'PY'\np=\"android/app/src/main/AndroidManifest.xml\"\ns=open(p,encoding=\"utf-8\").read()\ntag='<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-7808329877913294~9456707590\"/>'\nif \"APPLICATION_ID\" not in s:\n    i=s.index(\"<application\"); j=s.index(\">\",i)+1\n    s=s[:j]+\"\\n        \"+tag+s[j:]\nopen(p,\"w\",encoding=\"utf-8\").write(s)\nPY\ngrep APPLICATION_ID android/app/src/main/AndroidManifest.xml\n# প্রতিটি নতুন বিল্ডে versionCode বাড়বে (Play Store-এ প্রতিবার বড় সংখ্যা লাগে)\nsed -i \"s/versionCode [0-9]*/versionCode ${{ github.run_number }}/\" android/app/build.gradle\ngrep -n \"versionCode\\|versionName\" android/app/build.gradle\n"
    - name: Build debug APK
      run: 'cd "$PROJ/android"

        chmod +x gradlew

        ./gradlew assembleDebug

        '
    - name: Find the APK
      run: 'mkdir -p out

        F=$(find "$PROJ/android" -name "app-debug.apk" | head -1)

        if [ -z "$F" ]; then echo "❌ APK পাওয়া যায়নি"; find "$PROJ/android" -name "*.apk"; exit 1; fi

        cp "$F" out/BANGLA-LUDO.apk

        ls -la out

        '
    - uses: actions/upload-artifact@v4
      with:
        name: BANGLA-LUDO-apk-run${{ github.run_number }}
        path: out/BANGLA-LUDO.apk
        if-no-files-found: error
